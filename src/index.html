<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMouse — HID Diagnostics</title>
  <style>
    :root {
      --bg: #F0EBF8; --surface: #FFFFFF; --surface-2: #F5F0FC; --surface-3: #EDE6F7;
      --border: #D8CEEE; --border-2: #C8BCDF;
      --text: #1E1733; --text-2: #4A3F6B; --text-muted: #8B7DAE;
      --accent: #7C4FD4; --accent-2: #9D6EF0; --accent-fg: #FFFFFF;
      --accent-glow: rgba(124,79,212,0.15);
      --success-bg: #EDFAF2; --success-border: #5DB885; --success-text: #1A6B3E;
      --warn-bg: #FFF7E6; --warn-border: #C9922A; --warn-text: #7A4E08;
      --fail-bg: #FEF0F0; --fail-border: #D96060; --fail-text: #8B2020;
      --info-bg: #EEF4FF; --info-border: #6B9FD4; --info-text: #1A4D8B;
      --log-bg: #F3EEF9; --code: #6B3FC7;
      --shadow-sm: 0 1px 3px rgba(60,40,100,0.08);
      --shadow: 0 2px 8px rgba(60,40,100,0.10);
      --shadow-lg: 0 8px 24px rgba(60,40,100,0.14);
      --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg: #130F1F; --surface: #1C1730; --surface-2: #231D38; --surface-3: #2B2444;
      --border: #342B52; --border-2: #443866;
      --text: #EDE6FF; --text-2: #B8AADB; --text-muted: #7B6DAA;
      --accent: #9B6FF0; --accent-2: #B990FF; --accent-fg: #0E0B1A;
      --accent-glow: rgba(155,111,240,0.20);
      --success-bg: #0A221A; --success-border: #2A7A4A; --success-text: #5DC98A;
      --warn-bg: #1E1408; --warn-border: #7A5518; --warn-text: #E8A840;
      --fail-bg: #1E0A0A; --fail-border: #7A2828; --fail-text: #E87070;
      --info-bg: #0A1428; --info-border: #2A5490; --info-text: #6AA0E8;
      --log-bg: #1A1530; --code: #B090E8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow: 0 2px 8px rgba(0,0,0,0.35);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.45);
    }}

    /* ─── Font stacks ─── */
    :root {
      --font-ui:   'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'Fira Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ui);
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: 14px; line-height: 1.55;
      user-select: none; -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ─── App Shell ─── */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 0 20px;
    }
    .app-header-inner {
      max-width: 680px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px; height: 56px;
    }
    .app-icon {
      width: 32px; height: 32px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .app-icon svg { width: 18px; height: 18px; fill: white; }
    .app-title-block { flex: 1; min-width: 0; }
    .app-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.01em; }
    .app-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 400; letter-spacing: 0; }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-2); border-radius: var(--radius-sm);
      padding: 6px 12px; font-size: 12px; font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .refresh-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ─── Main Layout ─── */
    .app-body { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 16px; }

    /* ─── Section ─── */
    .section-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
      font-family: var(--font-ui);
    }

    /* ─── Device Cards ─── */
    .device-list { display: flex; flex-direction: column; gap: 6px; }
    .device-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 0;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      overflow: hidden;
    }
    .device-card:hover { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px var(--accent-glow); }
    .device-card.selected { border-color: var(--accent); box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-glow); }
    .device-card-inner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    .device-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 3px var(--bg);
    }
    .dot-razer   { background: var(--accent); }
    .dot-hp      { background: var(--warn-border); }
    .dot-other   { background: var(--text-muted); }
    .device-card-info { flex: 1; min-width: 0; }
    .device-card-name { font-weight: 600; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .device-card-hwid { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-card-badges { display: flex; gap: 4px; flex-wrap: nowrap; flex-shrink: 0; align-items: center; }

    /* ─── Badges ─── */
    .badge {
      font-size: 10.5px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap; border: 1px solid;
      font-family: var(--font-ui); letter-spacing: 0.01em;
    }
    .badge-razer   { background: linear-gradient(135deg,#7C4FD415,#9D6EF015); color: var(--accent); border-color: var(--accent); }
    .badge-hp      { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
    .badge-other   { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }
    .badge-known   { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
    .badge-missing { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }

    /* ─── Detail Panel ─── */
    .detail-panel {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      animation: slideIn 0.15s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .detail-header {
      background: linear-gradient(135deg, var(--accent-glow), transparent);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
    }
    .detail-icon {
      width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
    }
    .detail-icon svg { width: 18px; height: 18px; fill: white; }
    .detail-name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.02em; }
    .detail-meta { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px; }
    .detail-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }

    /* ─── HW Info Table ─── */
    .hw-table {
      padding: 12px 16px; display: grid;
      grid-template-columns: auto 1fr; gap: 4px 12px;
      border-bottom: 1px solid var(--border);
    }
    .hw-key { font-size: 11px; color: var(--text-muted); font-weight: 600; white-space: nowrap; line-height: 1.9; font-family: var(--font-ui); }
    .hw-val { font-size: 11px; font-family: var(--font-mono); color: var(--text-2); line-height: 1.9; word-break: break-all; }
    .hw-val.accent { color: var(--accent); font-weight: 600; }

    /* ─── Run Button ─── */
    .detail-actions { padding: 12px 16px; display: flex; gap: 8px; }
    .run-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-fg); border: none; border-radius: var(--radius-sm);
      padding: 11px 20px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em;
      font-family: var(--font-ui);
      cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px var(--accent-glow);
    }
    .run-btn:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px); }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.65s linear infinite; display: none; }
    .run-btn.loading .spinner { display: block; }
    .run-btn.loading .btn-label { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Result banner ─── */
    .result { display: none; margin: 0 16px 12px; border-radius: var(--radius-sm); padding: 11px 14px; border: 1px solid; font-size: 13px; font-family: var(--font-ui); }
    .result.success { display: block; background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .result.warn    { display: block; background: var(--warn-bg);    border-color: var(--warn-border);    color: var(--warn-text); }
    .result.fail    { display: block; background: var(--fail-bg);    border-color: var(--fail-border);    color: var(--fail-text); }
    .result-head { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; letter-spacing: -0.01em; }

    /* ─── Interface Results ─── */
    .iface-section { display: flex; flex-direction: column; gap: 8px; }
    .webid-banner {
      display: flex; align-items: center; gap: 10px;
      border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 12.5px; font-weight: 600; border: 1px solid;
      font-family: var(--font-ui); letter-spacing: -0.005em;
    }
    .webid-banner .wi-icon { font-size: 15px; }
    .webid-likely      { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .webid-workaround  { background: var(--warn-bg);    border-color: var(--warn-border);    color: var(--warn-text); }
    .webid-native      { background: var(--fail-bg);    border-color: var(--fail-border);    color: var(--fail-text); }
    .webid-unknown     { background: var(--surface-2);  border-color: var(--border);         color: var(--text-muted); }
    .iface-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .iface-block.winner { border-color: var(--success-border); }
    .iface-head {
      background: var(--surface-2); border-bottom: 1px solid var(--border);
      padding: 7px 12px; display: flex; align-items: center; gap: 6px;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-muted); font-family: var(--font-ui);
    }
    .iface-block.winner .iface-head { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .iface-win-star { color: var(--success-text); }
    .iface-hwid { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); opacity: 0.8; text-transform: none; letter-spacing: 0; }
    .tx-rows { padding: 9px 12px; display: flex; flex-direction: column; gap: 5px; }
    .tx-row { font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .tx-tag { font-size: 10.5px; font-weight: 700; background: var(--surface-3); border-radius: 4px; padding: 1px 7px; color: var(--text-muted); font-family: var(--font-mono); }
    .tx-ok   { color: var(--success-text); }
    .tx-err  { color: var(--fail-text); }
    .tx-dim  { color: var(--text-muted); }

    /* ─── Copy Block ─── */
    .copy-section {
      background: var(--surface); border: 1.5px solid var(--accent);
      border-radius: var(--radius); overflow: hidden; display: none;
    }
    .copy-section.visible { display: block; animation: slideIn 0.15s ease; }
    .copy-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--accent-glow);
      border-bottom: 1px solid var(--border);
    }
    .copy-title { font-size: 12.5px; font-weight: 700; color: var(--accent); font-family: var(--font-ui); letter-spacing: -0.01em; }
    .copy-hint  { font-size: 11px; color: var(--text-muted); font-family: var(--font-ui); }
    .copy-text {
      width: 100%; background: var(--log-bg); border: none; outline: none;
      padding: 12px 14px; font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text); resize: vertical; min-height: 110px; line-height: 1.65;
    }
    .copy-btn {
      display: block; width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none; color: var(--accent-fg);
      padding: 11px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em;
      font-family: var(--font-ui);
      cursor: pointer; transition: filter 0.15s;
    }
    .copy-btn:hover { filter: brightness(1.1); }
    .copy-btn.copied { background: linear-gradient(135deg, var(--success-border), #48a870); }

    /* ─── Webhook Row ─── */
    .webhook-row {
      display: flex; gap: 6px; padding: 10px 14px;
      border-top: 1px solid var(--border); background: var(--surface-2);
    }
    .webhook-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border-2);
      border-radius: var(--radius-sm); padding: 7px 10px;
      font-family: var(--font-mono); font-size: 11px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }
    .webhook-input:focus { border-color: var(--accent); }
    .webhook-input::placeholder { color: var(--text-muted); }
    .send-btn {
      white-space: nowrap; background: #5865F2; border: none; color: #fff;
      border-radius: var(--radius-sm); padding: 7px 14px;
      font-size: 12px; font-weight: 700; font-family: var(--font-ui);
      cursor: pointer; transition: filter 0.15s, opacity 0.15s;
    }
    .send-btn:hover:not(:disabled) { filter: brightness(1.12); }
    .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .send-btn.ok  { background: linear-gradient(135deg, var(--success-border), #48a870); }
    .send-btn.err { background: linear-gradient(135deg, var(--fail-border), #c04040); }
    .send-status {
      padding: 6px 14px 10px; font-size: 11.5px; font-family: var(--font-ui);
      display: none;
    }
    .send-status.ok  { display: block; color: var(--success-text); }
    .send-status.err { display: block; color: var(--fail-text); }

    /* ─── Update Banner ─── */
    .update-banner {
      display: none; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--accent-glow), transparent);
      border: 1.5px solid var(--accent); border-radius: var(--radius);
      padding: 10px 14px; font-size: 12.5px; font-family: var(--font-ui);
      animation: slideIn 0.2s ease;
    }
    .update-banner.visible { display: flex; }
    .update-banner-text { flex: 1; color: var(--text-2); }
    .update-banner-text strong { color: var(--accent); }
    .update-install-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-fg); border: none; border-radius: var(--radius-sm);
      padding: 6px 14px; font-size: 12px; font-weight: 700;
      font-family: var(--font-ui); cursor: pointer; white-space: nowrap;
      transition: filter 0.15s;
    }
    .update-install-btn:hover { filter: brightness(1.1); }
    .update-install-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ─── Empty / util ─── */
    .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px 0; font-family: var(--font-ui); }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    [hidden] { display: none !important; }
    code { font-family: var(--font-mono); font-size: 11px; background: var(--log-bg); padding: 1px 5px; border-radius: 4px; color: var(--code); }
  </style>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.686 2 6 5.582 6 10v4c0 3.866 2.686 7 6 7s6-3.134 6-7v-4c0-4.418-2.686-8-6-8zm0 2c2.761 0 4 2.91 4 6v.5h-3.5V9h-1v1.5H8V10c0-3.09 1.239-6 4-6zm-4 8h8v2c0 2.757-1.791 5-4 5s-4-2.243-4-5v-2z"/></svg>
    </div>
    <div class="app-title-block">
      <div class="app-title">OpenMouse Diagnostics</div>
      <div class="app-sub">Native HID · Razer, Logitech, SteelSeries &amp; more</div>
    </div>
    <button class="refresh-btn" onclick="scan()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</header>

<div id="update-banner" class="update-banner">
  <span style="font-size:16px">⬆️</span>
  <span class="update-banner-text">Update available: <strong id="update-version"></strong></span>
  <button class="update-install-btn" id="update-btn" onclick="installUpdate()">Download &amp; Install</button>
</div>

<div class="app-body">

  <div>
    <div class="section-label">Connected Devices</div>
    <div id="device-list" class="device-list">
      <div class="empty"><div class="empty-icon">🔍</div>Scanning…</div>
    </div>
  </div>

  <div id="detail-wrap" hidden>
    <div class="section-label">Selected Device</div>
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.686 2 6 5.582 6 10v4c0 3.866 2.686 7 6 7s6-3.134 6-7v-4c0-4.418-2.686-8-6-8z"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div id="detail-name" class="detail-name">—</div>
          <div id="detail-meta" class="detail-meta">—</div>
          <div id="detail-badges" class="detail-badges"></div>
        </div>
      </div>
      <div id="hw-table" class="hw-table"></div>
      <div class="detail-actions">
        <button id="run-btn" class="run-btn" onclick="runTest()">
          <div class="spinner"></div>
          <span class="btn-label" id="btn-label">Run Diagnostics</span>
        </button>
      </div>
      <div id="result" class="result"></div>
    </div>
  </div>

  <div id="iface-section" class="iface-section" hidden></div>

  <div id="copy-section" class="copy-section">
    <div class="copy-header">
      <span class="copy-title">Discord Report</span>
      <span class="copy-hint">Send directly or copy to clipboard</span>
    </div>
    <textarea id="copy-text" class="copy-text" readonly></textarea>
    <div class="webhook-row">
      <input id="webhook-url" class="webhook-input" type="text" placeholder="Discord Webhook URL (saved locally)" spellcheck="false" />
      <button id="send-btn" class="send-btn" onclick="sendToDiscord()">Send to Discord</button>
    </div>
    <div id="send-status" class="send-status"></div>
    <button id="copy-btn" class="copy-btn" onclick="copyReport()">Copy to Clipboard</button>
  </div>

</div>

<script type="module" src="/main.js"></script>
</body>
</html>
